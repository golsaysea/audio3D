<style>

 rgba(79,136,96,.12)}.value-box{min-width:68px;background:#fff;border:1px solid var(--line);border-radius:5px;color:var(--text);text-align:center;padding:5px 4px;font-family:Consolas,"Courier New",monospace;font-size:12px;font-weight:700;white-space:nowrap}.unit{margin-left:2px;color:#78837d;font-size:10px;font-weight:500}.btn-group{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-top:4px;padding-top:20px;border-top:1px solid var(--soft)}.btn{width:100%;min-height:40px;border:0;border-radius:7px;padding:10px;color:#fff;font-size:13px;font-weight:700;text-align:center;cursor:pointer;transition:.2s;box-shadow:0 2px 5px rgba(0,0,0,.12)}.btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 4px 10px rgba(0,0,0,.16)}.btn:active:not(:disabled){transform:translateY(1px);box-shadow:none}.btn:disabled{background:#c0d1c7;color:#77847c;cursor:not-allowed;transform:none;box-shadow:none}.btn-play{background:var(--green)}.btn-play:hover:not(:disabled){background:var(--green2)}.btn-batch{background:var(--blue)}.btn-batch:hover:not(:disabled){background:var(--blue2)}.btn-zip{background:var(--violet)}.btn-zip:hover:not(:disabled){background:var(--violet2)}.btn-folder{background:var(--rose)}.btn-folder:hover:not(:disabled){background:var(--rose2)}.btn-wake{background:var(--orange)}.btn-wake:hover:not(:disabled){background:var(--orange2)}.dropdown{position:relative;display:flex;min-width:0}.dropdown-content{display:none;position:absolute;bottom:100%;left:0;z-index:10;min-width:100%;overflow:hidden;margin-bottom:8px;border:1px solid var(--line);border-radius:8px;background:#fff;box-shadow:0 -5px 15px rgba(0,0,0,.15)}.dropdown-content a{display:block;padding:10px 12px;border-bottom:1px solid #e3ede7;color:var(--text);text-decoration:none;font-size:12px;font-weight:700;white-space:nowrap;transition:.2s}.dropdown-content a:last-child{border-bottom:0}.dropdown-content a:hover{background:#dcebe2;padding-left:18px}.dropdown:not(.disabled):hover .dropdown- <body>
<div class="container">
<h1>Audio3D Studio - 护眼高级版</h1>
<div class="upload-buttons"><label class="upload-label">选择文件夹导入<input type="file" id="folderUpload" webkitdirectory directory multiple style="display:none;"></label><label class="upload-label">选择音频 / MP4<input type="file" id="fileUpload" accept="audio/*,video/mp4,video/webm,video/quicktime,.wav,.mp3,.m4a,.aac,.ogg,.flac,.mp4,.m4v,.mov,.webm" multiple style="display:none;"></label></div>
<div class="queue-container" id="queueContainer"><table><thead><tr><th>文件名</th><th>类型</th><th>状态</th><th>操作</th></tr></thead><tbody id="queueBody"></tbody></table></div>
<div class="control-group"><div class="panel-title">音色与节奏</div><div class="control-grid"><div class="select-row"><label for="effectPreset">效果预设</label><select id="effectPreset"><option value="cathedral">大教堂空间</option><option value="basicStereo">基础立体音</option><option value="clean">原声增强</option><option value="phone">电话音</option><option value="electro">电音空间</option><option value="robot">机器人音</option><option value="lofi">Lo-fi 旧磁带</option></select></div><div class="slider-row"><label for="pitch">音调调整</label><input type="range" id="pitch" min="-12" max="12" step="1" value="0"><div class="value-box"><span id="pitch-val">+0</span><span class="unit">st</span></div></div><div class="slider-row"><label for="speed">速度调整</label><input type="range" id="speed" min="0.50" max="1.80" step="0.01" value="1"><div class="value-box"><span id="speed-val">1.00</span><span class="unit">x</span></div></div><div class="slider-row"><label for="motion">环绕运动</label><input type="range" id="motion" min="0" max="1" step="0.01" value="0"><div class="value-box"><span id="motion-val">0</span><span class="unit">%</span></div></div></div></div>
<div class="control-group"><div class="panel-title">空间与混响</div><div class="control-grid"><div class="slider-row"><label for="pan">左右定位</label><input type="range" id="pan" min="-1" max="1" step="0.01" value="0"><div class="value-box"><span id="pan-val">0.00</span></div></div><div class="slider-row"><label for="preDelay">预延迟</label><input type="range" id="preDelay" min="0" max="200" step="1" value="40"><div class="value-box"><span id="preDelay-val">40</span><span class="unit">ms</span></div></div><div class="slider-row"><label for="room">混响尺寸</label><input type="range" id="room" min="0" max="0.99" step="0.01" value="0.40"><div class="value-box"><span id="room-val">0.40</span></div></div><div class="slider-row"><label for="lowCut">低切</label><input type="range" id="lowCut" min="20" max="1000" step="10" value="300"><div class="value-box"><span id="lowCut-val">300</span><span class="unit">Hz</span></div></div><div class="slider-row"><label for="highCut">高切</label><input type="range" id="highCut" min="5000" max="20000" step="100" value="10000"><div class="value-box"><span id="highCut-val">10000</span><span class="unit">Hz</span></div></div><div class="slider-row"><label for="wet">混响比例</label><input type="range" id="wet" min="0" max="1" step="0.01" value="0.10"><div class="value-box"><span id="wet-val">0.10</span></div></div></div></div>
<div class="btn-group"><button id="playBtn" class="btn btn-play" disabled>试听首个</button><button id="wakeLockBtn" class="btn btn-wake">挂机模式</button><button id="batchExportBtn" class="btn btn-batch" disabled>批量渲染</button><div class="dropdown disabled" id="zipDropdownWrapper"><button id="zipMainBtn" class="btn btn-zip" disabled>打包 ZIP ▴</button><div class="dropdown-content" id="zipMenu"><a href="#" data-mode="all">全部打包 WAV + MP3 + MP4</a><a href="#" data-mode="wav">仅打包 WAV</a><a href="#" data-mode="mp3">仅打包 MP3</a><a href="#" data-mode="mp4">仅打包 MP4</a></div></div><button id="folderSaveBtn" class="btn btn-folder" disabled>输出到目录</button></div>
</div>
<script>
const STORAGE_KEY="audio3d_pages_preset_v6";
const defaultSettings={effectPreset:"basicStereo",pitch:0,speed:1,motion:.08,pan:0,preDelay:42,room:.89,lowCut:240,highCut:12000,wet:.04};
const effectPresets={

lofi:{ui:{preDelay:18,room:.28,lowCut:120,highCut:6500,wet:.1,motion:.04},characterLowCut:80,characterHighCut:6200,distortion:.16,distortionWet:.24,bitDepth:8,bitWet:.42,chorusWet:.16,chorusFrequency:.9,chorusDepth:.38,tremoloWet:.07,tremoloFrequency:3.2,tremoloDepth:.28,delayWet:.08,delayTime:.22,delayFeedback:.2}
};
const audioExtensions=/\.(wav|mp3|m4a|aac|ogg|flac|opus)$/i,videoExtensions=/\.(mp4|m4v|mov|webm)$/i,videoMp4Extensions=/\.(mp4|m4v)$/i;
const FFMPEG_CORE_URL="https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.10/dist/umd";
const queueBody=document.getElementById("queueBody"),queueContainer=document.getElementById("queueContainer"),playBtn=document.getElementById("playBtn"),batchExportBtn=document.getElementById("batchExportBtn"),zipDropdownWrapper=document.getElementById("zipDropdownWrapper"),zipMainBtn=document.getElementById("zipMainBtn"),zipMenuOptions=document.querySelectorAll("#zipMenu a"),folderSaveBtn=document.getElementById("folderSaveBtn"),wakeLockBtn=document.getElementById("wakeLockBtn"),effectPresetSelect=document.getElementById("effectPreset"),controlIds=["pitch","speed","motion","pan","preDelay","room","lowCut","highCut","wet"];
let settings=loadSettings(),player=null,isPlaying=false,isRendering=false,keepAwakeEnabled=false,wakeLock=null,ffmpegInstance=null,ffmpegReady=false,fileQueue=[];
if(!("showDirectoryPicker" in window))folderSaveBtn.title="浏览器不支持直接写入文件夹";updateWakeLockButton();
const liveGraph=createProcessingGraph(settings);initUI();updateLiveGraph();
document.getElementById("folderUpload").addEventListener("change",e=>handleFiles(e.target.files));
document.getElementById("fileUpload").addEventListener("change",e=>handleFiles(e.target.files));
effectPresetSelect.addEventListener("change",()=>{settings.effectPreset=effectPresetSelect.value;applyPresetDefaultsToUI(settings.effectPreset);updateLiveGraph();saveSettings();markOutputsStale()});
controlIds.forEach(id=>{document.getElementById(id).addEventListener("input",()=>{refreshValueDisplay(id);updateLiveGraph();saveSettings();markOutputsStale()})});
playBtn.addEventListener("click",async()=>{if(!player)return;await Tone.start();if(isPlaying){player.stop();playBtn.innerText="试听首个";isPlaying=false;return}player.stop();player.start();playBtn.innerText="暂停";isPlaying=true});
wakeLockBtn.addEventListener("click",async()=>{if(!("wakeLock" in navigator)){alert("当前浏览器不支持挂机模式，请保持窗口打开并关闭电脑休眠。");return}if(keepAwakeEnabled){keepAwakeEnabled=false;await releaseWakeLock();return}keepAwakeEnabled=true;const ok=await requestWakeLock();if(!ok)alert("浏览器暂时没有允许屏幕保持唤醒，请保持窗口打开并关闭电脑休眠。")});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&keepAwakeEnabled)requestWakeLock()});
batchExportBtn.addEventListener("click",async()=>{if(fileQueue.length===0||isRendering)return;isRendering=true;batchExportBtn.disabled=true;batchExportBtn.innerText="正在渲染...";playBtn.disabled=true;disableDownloadOptions();if(keepAwakeEnabled)await requestWakeLock();const decodeCtx=new(window.AudioContext||window.webkitAudioContext)(),currentSettings=collectSettings();for(let i=0;i<fileQueue.length;i++){const item=fileQueue[i];revokeItemOutputs(item);item.outputs={};item.status="processing";item.error="";updateQueueItemUI(i);try{const audioBuffer=await decodeFileToAudioBuffer(item.file,decodeCtx),renderSeconds=getRenderDuration(audioBuffer,currentSettings),renderedBuffer=await Tone.Offline(()=>{const offPlayer=new Tone.Player(audioBuffer),graph=createProcessingGraph(currentSettings);offPlayer.playbackRate=currentSettings.speed;offPlayer.connect(graph.input);offPlayer.start(0)},renderSeconds),finalBuffer=renderedBuffer.get(),wavBlob=bufferToWave(finalBuffer,finalBuffer.length);item.outputs.wav={blob:wavBlob,url:URL.createObjectURL(wavBlob)};if(window.lamejs){const mp3Blob=audioBufferToMp3(finalBuffer,192);item.outputs.mp3={blob:mp3Blob,url:URL.createObjectURL(mp3Blob)}}if(item.isVideoMp4){batchExportBtn.innerText="正在合成视频 MP4...";const videoBlob=await muxVideoWithProcessedAudio(item.file,wavBlob,item.name,finalBuffer.duration);item.outputs.mp4={blob:videoBlob,url:URL.createObjectURL(videoBlob)}}else item.outputs.mp4={blob:wavBlob,url:URL.createObjectURL(wavBlob)};item.status="done"}catch(error){console.error(`文件 ${item.name} 处理失败:`,error);item.status="error";item.error=getFriendlyError(item.file,error,item.isVideoMp4)}updateQueueItemUI(i)}if(decodeCtx.close)decodeCtx.close();isRendering=false;batchExportBtn.innerText="批量处理完成";playBtn.disabled=!player;if(fileQueue.some(item=>item.status==="done"))enableDownloadOptions();setTimeout(()=>{batchExportBtn.innerText="再次批量渲染";batchExportBtn.disabled=fileQueue.length===0},1600)});
zipMenuOptions.forEach(option=>{option.addEventListener("click",async event=>{event.preventDefault();if(zipMainBtn.disabled)return;const mode=event.target.getAttribute("data-mode"),originalText=zipMainBtn.innerText;zipMainBtn.disabled=true;zipDropdownWrapper.classList.add("disabled");zipMainBtn.innerText="正在打包...";try{const zip=new JSZip();let entryCount=0;fileQueue.forEach(item=>{if(item.status!=="done")return;if((mode==="all"||mode==="wav")&&item.outputs.wav){zip.file(`Audio3D_${item.name}.wav`,item.outputs.wav.blob);entryCount++}if((mode==="all"||mode==="mp3")&&item.outputs.mp3){zip.file(`Audio3D_${item.name}.mp3`,item.outputs.mp3.blob);entryCount++}if((mode==="all"||mode==="mp4")&&item.outputs.mp4){zip.file(`Audio3D_${item.name}.mp4`,item.outputs.mp4.blob);entryCount++}});if(entryCount===0)return;const content=await zip.generateAsync({type:"blob"}),url=URL.createObjectURL(content),anchor=document.createElement("a"),typeName=mode==="all"?"WAV_MP3_MP4":mode.toUpperCase();anchor.download=`Audio3D_${typeName}_Batch_${entryCount}files.zip`;anchor.href=url;anchor.click();URL.revokeObjectURL(url)}catch(error){alert("打包出错，请重新渲染后再试。")}finally{zipMainBtn.innerText=originalText;enableDownloadOptions()}})});
folderSaveBtn.addEventListener("click",async()=>{if(!("showDirectoryPicker" in window))return;try{const dirHandle=await window.showDirectoryPicker({mode:"readwrite"}),originalText=folderSaveBtn.innerText;disableDownloadOptions();folderSaveBtn.innerText="正在写入...";for(const item of fileQueue){if(item.status!=="done")continue;if(item.outputs.wav)await writeBlobToDirectory(dirHandle,`Audio3D_${item.name}.wav`,item.outputs.wav.blob);if(item.outputs.mp3)await writeBlobToDirectory(dirHandle,`Audio3D_${item.name}.mp3`,item.outputs.mp3.blob);if(item.outputs.mp4)await writeBlobToDirectory(dirHandle,`Audio3D_${item.name}.mp4`,item.outputs.mp4.blob)}alert("输出完成：视频源保存正常 MP4，音频源保留伪装 MP4。");folderSaveBtn.innerText=originalText;enableDownloadOptions()}catch(error){if(error.name!=="AbortError")alert("保存失败，请检查浏览器权限。");enableDownloadOptions()}});
async function handleFiles(files){const supportedFiles=Array.from(files).filter(isSupportedMediaFile);if(supportedFiles.length===0){alert("未检测到可处理的音频或 MP4 文件。");return}stopPreview();revokeQueueOutputs();fileQueue=await Promise.all(supportedFiles.map(async file=>{const isVideoMp4=await shouldRenderAsVideoMp4(file);return{file,name:safeFileBaseName(file.name.replace(/\.[^/.]+$/,"") ),displayName:file.name,typeLabel:getTypeLabel(file,isVideoMp4),isVideoMp4,status:"wait",error:"",outputs:{}}}));renderQueueTable();queueContainer.style.display="block";batchExportBtn.disabled=false;batchExportBtn.innerText="批量渲染";disableDownloadOptions();await preparePreview(fileQueue[0])}
async function preparePreview(item){playBtn.disabled=true;playBtn.innerText="加载中...";const decodeCtx=new(window.AudioContext||window.webkitAudioContext)();try{const audioBuffer=await decodeFileToAudioBuffer(item.file,decodeCtx);player=new Tone.Player(audioBuffer);player.playbackRate=collectSettings().speed;player.connect(liveGraph.input);playBtn.disabled=false;playBtn.innerText="试听首个"}catch(error){console.warn("预览加载失败:",error);playBtn.disabled=true;playBtn.innerText="无法试听"}finally{if(decodeCtx.close)decodeCtx.close()}}
async function decodeFileToAudioBuffer(file,audioContext){const arrayBuffer=await file.arrayBuffer();try{return await audioContext.decodeAudioData(arrayBuffer.slice(0))}catch(error){if(!isVideoMp4File(file))throw error;const wavBlob=await extractAudioWavFromVideo(file),wavBuffer=await wavBlob.arrayBuffer();return audioContext.decodeAudioData(wavBuffer)}}
function createProcessingGraph(values){const graphValues=normalizeSettings(values),preset=effectPresets[graphValues.effectPreset]||effectPresets.cathedral,input=new Tone.PitchShift(getCompensatedPitch(graphValues.pitch,graphValues.speed)),characterLowCut=new Tone.Filter({type:"highpass",frequency:preset.characterLowCut}),characterHighCut=new Tone.Filter({type:"lowpass",frequency:preset.characterHighCut}),distortion=new Tone.Distortion(preset.distortion),bitCrusher=new Tone.BitCrusher(preset.bitDepth),chorus=new Tone.Chorus(preset.chorusFrequency,2.5,preset.chorusDepth).start(),tremolo=new Tone.Tremolo(preset.tremoloFrequency,preset.tremoloDepth).start(),delayFx=new Tone.FeedbackDelay(preset.delayTime,preset.delayFeedback),pan=new Tone.Panner(graphValues.pan),autoPanner=new Tone.AutoPanner({frequency:getMotionFrequency(graphValues.motion),depth:graphValues.motion,wet:getMotionWet(graphValues.motion)}).start(),preDelay=new Tone.Delay(graphValues.preDelay/1000),lowCut=new Tone.Filter({type:"highpass",frequency:graphValues.lowCut}),highCut=new Tone.Filter({type:"lowpass",frequency:graphValues.highCut}),reverb=new Tone.Freeverb({roomSize:graphValues.room,dampening:8000}),crossFade=new Tone.CrossFade(graphValues.wet);input.chain(characterLowCut,characterHighCut,distortion,bitCrusher,chorus,tremolo,delayFx,pan,autoPanner);autoPanner.connect(crossFade.a);autoPanner.connect(preDelay);preDelay.chain(lowCut,highCut,reverb,crossFade.b);crossFade.toDestination();const graph={input,pitchShift:input,characterLowCut,characterHighCut,distortion,bitCrusher,chorus,tremolo,delayFx,pan,autoPanner,preDelay,lowCut,highCut,reverb,crossFade};applyGraphSettings(graph,graphValues);return graph}
function applyGraphSettings(graph,values){const graphValues=normalizeSettings(values),preset=effectPresets[graphValues.effectPreset]||effectPresets.cathedral;graph.pitchShift.pitch=getCompensatedPitch(graphValues.pitch,graphValues.speed);graph.characterLowCut.frequency.value=preset.characterLowCut;graph.characterHighCut.frequency.value=preset.characterHighCut;graph.distortion.distortion=preset.distortion;graph.distortion.wet.value=preset.distortionWet;graph.bitCrusher.wet.value=preset.bitWet;setBitCrusherBits(graph.bitCrusher,preset.bitDepth);graph.chorus.frequency.value=preset.chorusFrequency;graph.chorus.depth=preset.chorusDepth;graph.chorus.wet.value=preset.chorusWet;graph.tremolo.frequency.value=preset.tremoloFrequency;graph.tremolo.depth.value=preset.tremoloDepth;graph.tremolo.wet.value=preset.tremoloWet;graph.delayFx.delayTime.value=preset.delayTime;graph.delayFx.feedback.value=preset.delayFeedback;graph.delayFx.wet.value=preset.delayWet;graph.pan.pan.value=graphValues.pan;graph.autoPanner.frequency.value=getMotionFrequency(graphValues.motion);graph.autoPanner.depth.value=graphValues.motion;graph.autoPanner.wet.value=getMotionWet(graphValues.motion);graph.preDelay.delayTime.value=graphValues.preDelay/1000;graph.lowCut.frequency.value=graphValues.lowCut;graph.highCut.frequency.value=graphValues.highCut;graph.reverb.roomSize.value=graphValues.room;graph.crossFade.fade.value=graphValues.wet}
function updateLiveGraph(){const current=collectSettings();applyGraphSettings(liveGraph,current);if(player)player.playbackRate=current.speed}
function getCompensatedPitch(pitchSemitones,speed){return pitchSemitones-12*Math.log2(speed||1)}
function getMotionFrequency(motion){return .06+motion*.74}
function getMotionWet(motion){return Math.min(.85,Math.max(0,motion))}
function setBitCrusherBits(node,bits){try{if(node.bits&&typeof node.bits.value==="number")node.bits.value=bits;else node.bits=bits}catch(error){console.warn("Bit depth update failed:",error)}}
function getRenderDuration(audioBuffer,values){const speed=Math.max(.1,values.speed||1);return audioBuffer.duration/speed+4}
function renderQueueTable(){queueBody.innerHTML=fileQueue.map((item,index)=>`<tr><td class="file-name" title="${escapeHtml(item.displayName)}">${escapeHtml(item.displayName)}</td><td class="file-type">${escapeHtml(item.typeLabel)}</td><td id="status-${index}" class="status-${item.status}">${getStatusText(item)}</td><td id="action-${index}">-</td></tr>`).join("")}
function updateQueueItemUI(index){const item=fileQueue[index],statusTd=document.getElementById(`status-${index}`),actionTd=document.getElementById(`action-${index}`);if(!statusTd||!actionTd)return;statusTd.className=`status-${item.status}`;statusTd.innerText=getStatusText(item);if(item.status==="done"){const wavButton=item.outputs.wav?`<a href="${item.outputs.wav.url}" download="Audio3D_${escapeHtml(item.name)}.wav" class="btn-download">WAV</a>`:"",mp3Button=item.outputs.mp3?`<a href="${item.outputs.mp3.url}" download="Audio3D_${escapeHtml(item.name)}.mp3" class="btn-download btn-download-mp3">MP3</a>`:"",mp4Button=item.outputs.mp4?`<a href="${item.outputs.mp4.url}" download="Audio3D_${escapeHtml(item.name)}.mp4" class="btn-download btn-download-mp4">MP4</a>`:"";actionTd.innerHTML=`<div class="action-cell">${wavButton}${mp3Button}${mp4Button}</div>`;return}actionTd.innerHTML="-"}
function getStatusText(item){switch(item.status){case"wait":return"等待处理";case"processing":return"处理中...";case"done":return item.isVideoMp4?"完成视频":(item.outputs.mp3?"完成":"完成 WAV");case"error":return item.error||"失败";default:return""}}
async function getFFmpeg(){if(ffmpegReady&&ffmpegInstance)return ffmpegInstance;if(!window.FFmpegWASM||!window.FFmpegUtil)throw new Error("FFmpeg 未加载，请检查网络/CDN");const {FFmpeg}=FFmpegWASM,{toBlobURL}=FFmpegUtil;ffmpegInstance=new FFmpeg();ffmpegInstance.on("log",({message})=>console.debug("ffmpeg:",message));try{await ffmpegInstance.load({coreURL:await toBlobURL(`${FFMPEG_CORE_URL}/ffmpeg-core.js`,"text/javascript"),wasmURL:await toBlobURL(`${FFMPEG_CORE_URL}/ffmpeg-core.wasm`,"application/wasm")});ffmpegReady=true;return ffmpegInstance}catch(error){ffmpegInstance=null;ffmpegReady=false;throw new Error(`视频引擎加载失败：${getErrorMessage(error)}`)}}
async function extractAudioWavFromVideo(videoFile){const ffmpeg=await getFFmpeg(),{fetchFile}=FFmpegUtil,inputName=`${safeFileBaseName(videoFile.name)}_extract_input.mp4`,outputName=`${safeFileBaseName(videoFile.name)}_extract_audio.wav`;await deleteFFmpegFile(ffmpeg,inputName);await deleteFFmpegFile(ffmpeg,outputName);try{await ffmpeg.writeFile(inputName,await fetchFile(videoFile));await ffmpeg.exec(["-i",inputName,"-vn","-acodec","pcm_s16le","-ar","44100","-ac","2",outputName]);const data=await ffmpeg.readFile(outputName);return new Blob([data],{type:"audio/wav"})}finally{await deleteFFmpegFile(ffmpeg,inputName);await deleteFFmpegFile(ffmpeg,outputName)}}
async function muxVideoWithProcessedAudio(videoFile,audioBlob,baseName,duration){const ffmpeg=await getFFmpeg(),{fetchFile}=FFmpegUtil,inputName=`${safeFileBaseName(baseName)}_input.mp4`,audioName=`${safeFileBaseName(baseName)}_audio.wav`,outputName=`${safeFileBaseName(baseName)}_audio3d.mp4`,durationArg=String(Math.max(.1,duration||0).toFixed(3));await deleteFFmpegFile(ffmpeg,inputName);await deleteFFmpegFile(ffmpeg,audioName);await deleteFFmpegFile(ffmpeg,outputName);try{await ffmpeg.writeFile(inputName,await fetchFile(videoFile));await ffmpeg.writeFile(audioName,await fetchFile(audioBlob));try{await ffmpeg.exec(["-i",inputName,"-i",audioName,"-map","0:v:0","-map","1:a:0","-c:v","copy","-c:a","aac","-b:a","192k","-t",durationArg,"-movflags","+faststart",outputName])}catch(copyError){console.warn("视频无损合成失败，尝试重新编码视频:",copyError);await deleteFFmpegFile(ffmpeg,outputName);await ffmpeg.exec(["-i",inputName,"-i",audioName,"-map","0:v:0","-map","1:a:0","-c:v","mpeg4","-q:v","4","-c:a","aac","-b:a","192k","-t",durationArg,"-movflags","+faststart",outputName])}const data=await ffmpeg.readFile(outputName);return new Blob([data],{type:"video/mp4"})}finally{await deleteFFmpegFile(ffmpeg,inputName);await deleteFFmpegFile(ffmpeg,audioName);await deleteFFmpegFile(ffmpeg,outputName)}}
async function deleteFFmpegFile(ffmpeg,fileName){try{await ffmpeg.deleteFile(fileName)}catch(error){}}
async function requestWakeLock(){if(!("wakeLock" in navigator)){updateWakeLockButton();return false}try{if(wakeLock){updateWakeLockButton();return true}wakeLock=await navigator.wakeLock.request("screen");wakeLock.addEventListener("release",()=>{wakeLock=null;updateWakeLockButton()});updateWakeLockButton();return true}catch(error){console.warn("挂机模式启动失败:",error);wakeLock=null;updateWakeLockButton();return false}}
async function releaseWakeLock(){if(wakeLock){const current=wakeLock;wakeLock=null;try{await current.release()}catch(error){console.warn("挂机模式关闭失败:",error)}}updateWakeLockButton()}
function updateWakeLockButton(){if(!wakeLockBtn)return;if(!("wakeLock" in navigator)){wakeLockBtn.innerText="挂机不可用";wakeLockBtn.disabled=true;wakeLockBtn.title="当前浏览器不支持屏幕唤醒";return}wakeLockBtn.disabled=false;wakeLockBtn.innerText=keepAwakeEnabled?(wakeLock?"挂机中":"待恢复"):"挂机模式";wakeLockBtn.title="渲染时尽量保持屏幕唤醒，降低后台暂停概率"}
function enableDownloadOptions(){zipMainBtn.disabled=false;zipDropdownWrapper.classList.remove("disabled");if("showDirectoryPicker" in window)folderSaveBtn.disabled=false}
function disableDownloadOptions(){zipMainBtn.disabled=true;zipDropdownWrapper.classList.add("disabled");folderSaveBtn.disabled=true}
function stopPreview(){if(player){player.stop();player.dispose();player=null}isPlaying=false;playBtn.innerText="试听首个";playBtn.disabled=true}
function markOutputsStale(){if(isRendering||fileQueue.length===0)return;let changed=false;fileQueue.forEach(item=>{if(item.status==="done"||Object.keys(item.outputs).length>0){revokeItemOutputs(item);item.outputs={};item.status="wait";item.error="";changed=true}});if(changed){fileQueue.forEach((_,index)=>updateQueueItemUI(index));batchExportBtn.disabled=false;batchExportBtn.innerText="批量渲染";disableDownloadOptions()}}
function revokeQueueOutputs(){fileQueue.forEach(revokeItemOutputs)}
function revokeItemOutputs(item){Object.values(item.outputs||{}).forEach(output=>{if(output&&output.url)URL.revokeObjectURL(output.url)})}
function initUI(){effectPresetSelect.value=settings.effectPreset;controlIds.forEach(id=>{document.getElementById(id).value=settings[id];refreshValueDisplay(id)})}
function applyPresetDefaultsToUI(presetName){const preset=effectPresets[presetName]||effectPresets.cathedral;Object.entries(preset.ui||{}).forEach(([id,value])=>{const element=document.getElementById(id);if(!element)return;element.value=value;refreshValueDisplay(id)})}
function refreshValueDisplay(id){const value=parseFloat(document.getElementById(id).value),display=document.getElementById(`${id}-val`);if(!display)return;if(id==="pitch")display.innerText=`${value>0?"+":""}${value.toFixed(0)}`;else if(id==="speed")display.innerText=value.toFixed(2);else if(id==="motion")display.innerText=Math.round(value*100);else if(id==="pan"||id==="room"||id==="wet")display.innerText=value.toFixed(2);else display.innerText=value.toFixed(0)}
function collectSettings(){const current={effectPreset:effectPresetSelect.value};controlIds.forEach(id=>{current[id]=parseFloat(document.getElementById(id).value)});settings=normalizeSettings(current);return settings}
function normalizeSettings(raw){return{...defaultSettings,...raw,effectPreset:effectPresets[raw.effectPreset]?raw.effectPreset:defaultSettings.effectPreset,pitch:clampNumber(raw.pitch,-12,12,defaultSettings.pitch),speed:clampNumber(raw.speed,.5,1.8,defaultSettings.speed),motion:clampNumber(raw.motion,0,1,defaultSettings.motion),pan:clampNumber(raw.pan,-1,1,defaultSettings.pan),preDelay:clampNumber(raw.preDelay,0,200,defaultSettings.preDelay),room:clampNumber(raw.room,0,.99,defaultSettings.room),lowCut:clampNumber(raw.lowCut,20,1000,defaultSettings.lowCut),highCut:clampNumber(raw.highCut,5000,20000,defaultSettings.highCut),wet:clampNumber(raw.wet,0,1,defaultSettings.wet)}}
function clampNumber(value,min,max,fallback){const numeric=Number(value);if(!Number.isFinite(numeric))return fallback;return Math.min(max,Math.max(min,numeric))}
function loadSettings(){const saved=localStorage.getItem(STORAGE_KEY);if(!saved)return{...defaultSettings};try{return normalizeSettings({...defaultSettings,...JSON.parse(saved)})}catch(error){return{...defaultSettings}}}
function saveSettings(){localStorage.setItem(STORAGE_KEY,JSON.stringify(collectSettings()))}
function isSupportedMediaFile(file){const type=file.type||"";return type.startsWith("audio/")||type.startsWith("video/")||audioExtensions.test(file.name)||videoExtensions.test(file.name)}
function isVideoMp4File(file){const type=file.type||"";if(type.startsWith("audio/"))return false;return type==="video/mp4"||videoMp4Extensions.test(file.name)}
async function shouldRenderAsVideoMp4(file){if(!isVideoMp4File(file))return false;if(await isWaveContainer(file))return false;const hasVideo=await hasPlayableVideoTrack(file);return hasVideo!==false}
async function isWaveContainer(file){const header=await file.slice(0,12).arrayBuffer(),bytes=new Uint8Array(header);return bytes.length>=12&&String.fromCharCode(bytes[0],bytes[1],bytes[2],bytes[3])==="RIFF"&&String.fromCharCode(bytes[8],bytes[9],bytes[10],bytes[11])==="WAVE"}
function hasPlayableVideoTrack(file){return new Promise(resolve=>{const video=document.createElement("video"),url=URL.createObjectURL(file);let settled=false;const done=value=>{if(settled)return;settled=true;URL.revokeObjectURL(url);resolve(value)};video.preload="metadata";video.muted=true;video.onloadedmetadata=()=>done(video.videoWidth>0&&video.videoHeight>0);video.onerror=()=>done(null);setTimeout(()=>done(null),1800);video.src=url})}
function getTypeLabel(file,isVideoMp4=isVideoMp4File(file)){const type=file.type||"";if(isVideoMp4)return"视频 MP4";if(type.startsWith("video/")||videoExtensions.test(file.name))return"视频音轨";return"音频"}
function getErrorMessage(error){return error&&error.message?error.message:String(error||"未知错误")}
function getFriendlyError(file,error,isVideoMp4=isVideoMp4File(file)){const detail=getErrorMessage(error).slice(0,48);if(isVideoMp4)return`视频 MP4 合成失败：${detail}`;if(getTypeLabel(file,isVideoMp4)==="视频音轨")return`浏览器未解析音轨：${detail}`;return`解码失败：${detail}`}
async function writeBlobToDirectory(dirHandle,fileName,blob){const fileHandle=await dirHandle.getFileHandle(fileName,{create:true}),writable=await fileHandle.createWritable();await writable.write(blob);await writable.close()}
function audioBufferToMp3(abuffer,kbps){const channels=Math.min(2,abuffer.numberOfChannels),sampleRate=abuffer.sampleRate,encoder=new lamejs.Mp3Encoder(channels,sampleRate,kbps),mp3Data=[],sampleBlockSize=1152;for(let offset=0;offset<abuffer.length;offset+=sampleBlockSize){const end=Math.min(offset+sampleBlockSize,abuffer.length),left=floatTo16BitPCM(abuffer.getChannelData(0),offset,end);let mp3Buffer;if(channels===2){const right=floatTo16BitPCM(abuffer.getChannelData(1),offset,end);mp3Buffer=encoder.encodeBuffer(left,right)}else mp3Buffer=encoder.encodeBuffer(left);if(mp3Buffer.length>0)mp3Data.push(mp3Buffer)}const flush=encoder.flush();if(flush.length>0)mp3Data.push(flush);return new Blob(mp3Data,{type:"audio/mpeg"})}
function floatTo16BitPCM(channelData,start,end){const result=new Int16Array(end-start);for(let i=start;i<end;i++){const sample=Math.max(-1,Math.min(1,channelData[i]));result[i-start]=sample<0?sample*32768:sample*32767}return result}
function bufferToWave(abuffer,len){const numOfChan=abuffer.numberOfChannels,bytesPerSample=2,dataLength=len*numOfChan*bytesPerSample,buffer=new ArrayBuffer(44+dataLength),view=new DataView(buffer),channels=[];let offset=0;const setUint16=data=>{view.setUint16(offset,data,true);offset+=2},setUint32=data=>{view.setUint32(offset,data,true);offset+=4};setUint32(0x46464952);setUint32(36+dataLength);setUint32(0x45564157);setUint32(0x20746d66);setUint32(16);setUint16(1);setUint16(numOfChan);setUint32(abuffer.sampleRate);setUint32(abuffer.sampleRate*numOfChan*bytesPerSample);setUint16(numOfChan*bytesPerSample);setUint16(16);setUint32(0x61746164);setUint32(dataLength);for(let i=0;i<numOfChan;i++)channels.push(abuffer.getChannelData(i));for(let pos=0;pos<len;pos++){for(let i=0;i<numOfChan;i++){const sample=Math.max(-1,Math.min(1,channels[i][pos]));view.setInt16(offset,sample<0?sample*32768:sample*32767,true);offset+=2}}return new Blob([buffer],{type:"audio/wav"})}
function safeFileBaseName(name){const cleaned=name.replace(/[\\/:*?"<>|]+/g,"_").trim();return(cleaned||"audio").slice(0,120)}
function escapeHtml(value){return String(value).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}
</script>
